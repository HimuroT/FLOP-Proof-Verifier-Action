name: Technocore Proof Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cryptography
        run: pip install cryptography>=41.0.0

      - name: Verify Technocore Proof
        run: python3 scripts/verify_proof_ci.py contribution-proof.json || python3 scripts/verify_proof_ci.py proof/contribution-proof.json
